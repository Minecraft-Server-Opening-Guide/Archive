<h2>基本情况</h2>
<p>MCSOG 是一个由一群 Minecraft 服主打造的一站式开服教学网站。上线于2026年10月18日。</p>
<p>&nbsp;</p>
<h2>这里有什么</h2>
<p>教程分 Java 版与基岩版两条主线，另有运维与常见问题；资源区按核心、插件、模组、数据包、工具软件分类；版本时间线记录各版本与适配情况。</p>
<p>&nbsp;</p>
